name: Build Exynos 9820 Kernels (FreeRunner base) with OriginSU

# Kernel: the REAL FreeRunnerKernel source, Project-Matrixx-New/android_kernel_samsung_exynos9820
# (named in LeDrew2017/FreeRunnerKernel's release notes). Linux 4.14, Galaxy S10 / Note10 / F62.
# Branch lineage-24.0 = FreeRunner v3.9 (Nov 2026: clone3 / CAP_CHECKPOINT_RESTORE backports; the
# defconfig still says v3.8-R2 until the dev pushes the bump). It ships KernelSU-Next (git
# submodule) + SuSFS v2.3.0 already integrated in fs/.
#
# NOTE: LeDrew2017/android_kernel_samsung_exynos9820 (used before) is a Dec-2024 mirror of
# hiratazx's Yuki v3.0 tree, NOT FreeRunner. ProjectMatrixx-exynos9820 is the old org (stops at v3.7).
#
# Build is done the way FreeRunner builds it: `make LLVM=1` with clang 21 (official LLVM 21.1.8
# release), no GNU binutils, no CROSS_COMPILE, config fragments merged with merge_config.sh.
#
# root=ksunext builds FreeRunner as-is (control build: it MUST boot, otherwise the problem is the
# toolchain / packaging, not OriginSU). root=originsu replaces KSU-Next by OriginSU and adapts the
# tree's KSU-Next hooks with scripts/originsu_hooks_4.14.sh (see that file for why).
#
# OriginSU is discontinued (it became KazeSU, https://github.com/KazeSU/KazeSU) and this builder is
# frozen on the last OriginSU release, v4.3.0 (tag v4.3.0 in the KazeSU repo, GitHub release
# "legacy-v4.3.0"). KazeSU v1.x does not build on this 4.14 tree (its SELinux code needs the 5.10+
# struct selinux_state layout: policy/policy_mutex/status_lock/status_page; this tree only has
# avc + ss), so OriginSU v4.3.0 stays the recommended root here. The FreeRunner developer
# (LeDrew2017, https://github.com/LeDrew2017/FreeRunnerKernel) is taking the project over.
# 4.14 is the newest kernel available for Exynos 9820. Manual runs only.

on:
  workflow_dispatch:
    inputs:
      originsu_ref:
        description: "OriginSU tag to build (last OriginSU release: v4.3.0)"
        required: false
        default: "v4.3.0"
      kernel_branch:
        description: "FreeRunner kernel branch (Project-Matrixx-New/android_kernel_samsung_exynos9820)"
        required: false
        default: "lineage-24.0"
      device:
        description: "Device to build (all = every device)"
        type: choice
        options: [all, beyond0lte, beyond1lte, beyond2lte, beyondx, d1, d1x, d2s, d2x, f62]
        default: all
      root:
        description: "originsu = OriginSU; ksunext = FreeRunner as-is (control build to validate the CI)"
        type: choice
        options: [originsu, ksunext]
        default: originsu
      hook_mode:
        description: "susfs = root + SuSFS (v2.4.0 by default, or in-tree v2.3.0 via susfs_version); manual = root only, SuSFS disabled"
        type: choice
        options: [susfs, manual]
        default: susfs
      susfs_version:
        description: "SuSFS (susfs mode only): v2.4.0 = upgraded (JackA1ltman 4.14 port), intree = FreeRunner's v2.3.0"
        type: choice
        options: [v2.4.0, intree]
        default: v2.4.0
      extra_features:
        description: "Add Baseband Guard + NoMount + Droidspaces"
        type: boolean
        default: false
      kpm:
        description: "Enable CONFIG_KPM"
        type: boolean
        default: false
      publish:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

concurrency:
  group: kernel-build
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  KERNEL_REPO: Project-Matrixx-New/android_kernel_samsung_exynos9820
  KERNEL_DIR: kernel
  AK3_REPO: https://github.com/LeDrew2017/Anykernel
  LLVM_VERSION: "21.1.8"
  KBUILD_BUILD_USER: builder
  KBUILD_BUILD_HOST: github-actions

jobs:
  # ------------------------------------------------------------------
  # 1) What to build (manual runs only)
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      build: ${{ steps.ver.outputs.build }}
      branch: ${{ steps.ver.outputs.branch }}
      devices: ${{ steps.ver.outputs.devices }}
    steps:
      - name: OriginSU release (with its manager APK)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ inputs.kernel_branch }}"; BRANCH="${BRANCH:-lineage-24.0}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          DEV="${{ inputs.device }}"
          if [ -z "$DEV" ] || [ "$DEV" = "all" ]; then
            echo 'devices=["beyond0lte","beyond1lte","beyond2lte","beyondx","d1","d1x","d2s","d2x","f62"]' >> "$GITHUB_OUTPUT"
          else
            echo "devices=[\"$DEV\"]" >> "$GITHUB_OUTPUT"
          fi

          TAG="${{ inputs.originsu_ref }}"; TAG="${TAG:-v4.3.0}"
          # OriginSU tags only (v4.x). samakshkambxj/OriginSU now redirects to KazeSU/KazeSU,
          # where KazeSU v1.x lives too: never pick its "latest" release.
          case "$TAG" in
            v4.*) ;;
            *) echo "::error::$TAG is not an OriginSU tag (expected v4.x, e.g. v4.3.0)"; exit 1 ;;
          esac
          echo "OriginSU version: $TAG"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          APKS=$(gh release view "$TAG" --repo KazeSU/KazeSU --json assets -q '.assets[].name' 2>/dev/null | grep -E '\.apk$' || true)
          [ -n "$APKS" ] || echo "::warning::OriginSU release $TAG: manager APK not found"
          echo "Manual run -> build"; echo "build=true" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 2) Build (one job per device)
  # ------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    # Pinned: the official LLVM release binaries link against libxml2.so.2 (Ubuntu 24.04),
    # newer runner images ship a libxml2 with another soname -> ld.lld fails to start.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # beyond0lte=S10e, beyond1lte=S10, beyond2lte=S10+, beyondx=S10 5G,
        # d1=Note10, d1x=Note10 5G, d2s=Note10+, d2x=Note10+ 5G, f62=Galaxy F62.
        device: ${{ fromJSON(needs.check.outputs.devices) }}
    env:
      DEVICE: ${{ matrix.device }}
      ORIGINSU_TAG: ${{ needs.check.outputs.tag }}
      KERNEL_BRANCH: ${{ needs.check.outputs.branch }}
      ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.root || 'originsu' }}
      HOOK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.hook_mode || 'susfs' }}
      SUSFS_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.susfs_version || 'v2.4.0' }}
      EXTRA_FEATURES: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_features || 'false' }}
      KPM: ${{ github.event_name == 'workflow_dispatch' && inputs.kpm || 'false' }}

    steps:
      - name: Checkout builder scripts
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex zip curl git libssl-dev libelf-dev zstd xz-utils \
            python3 python-is-python3 cpio unzip libxml2

      - name: Clone FreeRunner kernel (with its submodules)
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" --recurse-submodules --shallow-submodules \
            "https://github.com/${KERNEL_REPO}.git" "$KERNEL_DIR"
          echo "KERNEL_COMMIT=$(git -C "$KERNEL_DIR" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          D="$KERNEL_DIR/arch/arm64/configs/exynos9820-${DEVICE}_defconfig"
          [ -f "$D" ] || { echo "::error::$D missing on $KERNEL_BRANCH"; exit 1; }
          echo "-- $(grep -m1 CONFIG_LOCALVERSION= "$D")"
          echo "-- SuSFS in tree: $(grep -m1 '#define SUSFS_VERSION' "$KERNEL_DIR/include/linux/susfs.h" 2>/dev/null || echo none)"

      - name: Download LLVM ${{ env.LLVM_VERSION }} (same major as FreeRunner's clang-21)
        run: |
          F="LLVM-${LLVM_VERSION}-Linux-X64"
          curl -fL --retry 5 --retry-all-errors -o /tmp/llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${F}.tar.xz"
          mkdir -p "$HOME/llvm" && tar -C "$HOME/llvm" --strip-components=1 -xf /tmp/llvm.tar.xz && rm -f /tmp/llvm.tar.xz
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          # Fail here (not 10 min into the build) if a tool can't start (missing shared lib...)
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            "$HOME/llvm/bin/$t" --version >/dev/null || { echo "::error::$t does not run"; ldd "$HOME/llvm/bin/$t" | grep 'not found'; exit 1; }
          done
          echo "TOOLCHAIN=$("$HOME/llvm/bin/clang" --version | head -n1)" >> "$GITHUB_ENV"

      - name: Kernel tweaks (no -dirty suffix)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i "s/printf '%s' -dirty/:/g" scripts/setlocalversion 2>/dev/null || true
          : > "$RUNNER_TEMP/builder.config"     # config fragment filled by the next steps
          # TCP BBR (Google): built in and default congestion control. The stock defconfig only
          # has BIC (default)/CUBIC/Westwood/HTCP. CUBIC stays available:
          #   sysctl -w net.ipv4.tcp_congestion_control=cubic
          # + fq as default qdisc: fq is built in the stock defconfig but unused (default qdisc =
          # pfifo_fast, NET_SCH_DEFAULT off). On fq, BBR's rate (sk_pacing_rate) is applied by the
          # qdisc and the socket is marked SK_PACING_FQ, so TCP skips its own per-socket hrtimer
          # pacing (4.13+ fallback): cheaper and more precise.
          cat >> "$RUNNER_TEMP/builder.config" <<'EOF'
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_DEFAULT=y
          CONFIG_DEFAULT_FQ=y
          CONFIG_DEFAULT_NET_SCH="fq"
          EOF
          # Optimizations missing from FreeRunner (everything else — power-efficient workqueues,
          # swappiness up to 200, IPv4 TTL target, WireGuard, updated LZ4 with arm64 asm,
          # Cortex-A55 tuning — is already in the tree):
          # - zstd for ZRAM, available but not default (lz4 stays the default algorithm):
          #     echo zstd > /sys/block/zram0/comp_algorithm   (before swapon)
          # - IPv6 HL target, the IPv6 counterpart of the TTL target (tethering)
          cat >> "$RUNNER_TEMP/builder.config" <<'EOF'
          CONFIG_CRYPTO_ZSTD=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_TARGET_HL=y
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/builder.config"
          echo "FRAG=$RUNNER_TEMP/builder.config" >> "$GITHUB_ENV"

      - name: Integrate OriginSU (replacing KernelSU-Next)
        if: env.ROOT == 'originsu'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # 1) Drop KSU-Next (submodule) and set up OriginSU (./KernelSU + drivers/kernelsu symlink)
          rm -rf KernelSU-Next KernelSU drivers/kernelsu

          # 1b) Optional SuSFS upgrade (in-tree v2.3.0 -> v2.4.0), before OriginSU and the hooks
          if [ "$HOOK_MODE" = "susfs" ] && [ "$SUSFS_VERSION" = "v2.4.0" ]; then
            bash "$GITHUB_WORKSPACE/builder/scripts/susfs_v2.4.sh" "$GITHUB_WORKSPACE/builder/scripts"
          fi

          # samakshkambxj/OriginSU now redirects to KazeSU/KazeSU, whose main branch is KazeSU:
          # take setup.sh from the OriginSU tag itself and clone the KazeSU URL directly.
          curl -LSs --fail --retry 3 "https://raw.githubusercontent.com/KazeSU/KazeSU/$ORIGINSU_TAG/kernel/setup.sh" \
            | sed 's|^REPO_URL=.*|REPO_URL="https://github.com/KazeSU/KazeSU"|' \
            | bash -s "$ORIGINSU_TAG"
          [ -e drivers/kernelsu/Kconfig ] || { echo "::error::drivers/kernelsu missing after setup.sh"; exit 1; }
          [ "$(git -C KernelSU describe --tags --exact-match 2>/dev/null)" = "$ORIGINSU_TAG" ] \
            || { echo "::error::OriginSU is not at $ORIGINSU_TAG"; git -C KernelSU log -1 --oneline; exit 1; }
          sed -i 's/\$(KSU_COMMIT_SHA)-dirty/$(KSU_COMMIT_SHA)/' KernelSU/kernel/Kbuild 2>/dev/null || true

          # 2) OriginSU source compat for 4.14 + adapt the tree's KSU-Next hooks to OriginSU
          bash "$GITHUB_WORKSPACE/builder/scripts/originsu_compat_4.14.sh"
          bash "$GITHUB_WORKSPACE/builder/scripts/originsu_hooks_4.14.sh"

          # 3) Config. The hook method is a Kconfig choice whose default (tracepoint) is GKI-only,
          #    so one of KSU_SUSFS / KSU_MANUAL_HOOK must be selected explicitly.
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_MULTI_MANAGER_SUPPORT=y"
            echo "# CONFIG_KSU_DEBUG is not set"
            if [ "$KPM" = "true" ]; then echo "CONFIG_KPM=y"; else echo "# CONFIG_KPM is not set"; fi
            if [ "$HOOK_MODE" = "susfs" ]; then
              echo "# CONFIG_KSU_MANUAL_HOOK is not set"
              echo "CONFIG_KSU_SUSFS=y"
              for o in SUS_PATH SUS_MOUNT SUS_KSTAT SPOOF_UNAME ENABLE_LOG HIDE_KSU_SUSFS_SYMBOLS \
                       SPOOF_CMDLINE_OR_BOOTCONFIG OPEN_REDIRECT SUS_MAP; do
                echo "CONFIG_KSU_SUSFS_${o}=y"
              done
            else
              echo "# CONFIG_KSU_SUSFS is not set"
              echo "CONFIG_KSU_MANUAL_HOOK=y"
            fi
          } >> "$FRAG"

      - name: Extra features — Baseband Guard, NoMount, Droidspaces
        if: env.EXTRA_FEATURES == 'true'
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/builder/scripts/extra_features.sh" "$FRAG"

      - name: Configure (defconfig + fragment, as FreeRunner's build.sh)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make O=out ARCH=arm64 LLVM=1 "exynos9820-${DEVICE}_defconfig"
          if [ -s "$FRAG" ]; then
            echo "--- fragment ---"; cat "$FRAG"
            ARCH=arm64 scripts/kconfig/merge_config.sh -O out out/.config "$FRAG"
            make O=out ARCH=arm64 LLVM=1 olddefconfig
            # Fail early if a requested option did not stick (missing dependency, typo...)
            MISS=0
            while read -r l; do
              case "$l" in CONFIG_*=*) grep -qxF "$l" out/.config || { echo "::warning::not applied: $l"; MISS=1; };; esac
            done < "$FRAG"
            for k in CONFIG_KSU=y CONFIG_KSU_SUSFS=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_BBG=y CONFIG_NOMOUNT=y; do
              grep -qxF "$k" "$FRAG" && ! grep -qxF "$k" out/.config && { echo "::error::$k requested but not set"; exit 1; }
            done
          fi
          echo "--- effective root configs ---"
          grep -E '^(# )?CONFIG_(KSU|KPM|BBG|NOMOUNT)' out/.config || true
          echo "--- TCP congestion control / default qdisc ---"
          grep -E '^CONFIG_(TCP_CONG_BBR|DEFAULT_TCP_CONG|NET_SCH_FQ|NET_SCH_DEFAULT|DEFAULT_NET_SCH)=' out/.config || true
          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"' out/.config || { echo "::error::BBR is not the default TCP congestion control"; exit 1; }
          grep -q '^CONFIG_DEFAULT_NET_SCH="fq"' out/.config  || { echo "::error::fq is not the default qdisc"; exit 1; }
          echo "--- optimizations ---"
          for k in CONFIG_CRYPTO_ZSTD=y CONFIG_IP6_NF_TARGET_HL=y CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y CONFIG_IP_NF_TARGET_TTL=y; do
            grep -qxF "$k" out/.config && echo "  $k" || { echo "::error::$k missing from the final config"; exit 1; }
          done
          grep -E '^CONFIG_ZRAM_DEFAULT_COMP_ALGORITHM=' out/.config || true

      - name: Compile the kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set +e
          make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          grep -E -- '^-- (OriginSU|You |SUSFS)' build.log | sort -u || true
          if [ "$RC" -ne 0 ] || [ ! -f out/arch/arm64/boot/Image ]; then
            echo "::error::Build failed (make exit code $RC). First errors:"
            grep -nE "error:|Error [0-9]|undefined reference|undefined symbol|\*\*\*" build.log | head -n 40 || true
            exit 1
          fi

      - name: Upload build log (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.device }}
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config
          if-no-files-found: ignore

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 "$AK3_REPO" AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image" AnyKernel3/Image
          AK=AnyKernel3/anykernel.sh
          case "$DEVICE" in
            beyond0lte) MODEL="Galaxy S10e";; beyond1lte) MODEL="Galaxy S10";; beyond2lte) MODEL="Galaxy S10+";;
            beyondx) MODEL="Galaxy S10 5G";; d1) MODEL="Galaxy Note10";; d1x) MODEL="Galaxy Note10 5G";;
            d2s) MODEL="Galaxy Note10+";; d2x) MODEL="Galaxy Note10+ 5G";; f62) MODEL="Galaxy F62";; *) MODEL="$DEVICE";;
          esac
          if [ "$ROOT" = "originsu" ]; then FLAVOR="OriginSU-${ORIGINSU_TAG}-${HOOK_MODE}"; else FLAVOR="KSUNext-control"; fi
          if [ "$ROOT" = "originsu" ] && [ "$HOOK_MODE" = "susfs" ]; then
            FLAVOR="${FLAVOR}-$(grep -m1 '#define SUSFS_VERSION' "$KERNEL_DIR/include/linux/susfs.h" | cut -d'"' -f2)"
          fi
          sed -i -E '/^device\.name[0-9]+=/d' "$AK"
          sed -i -E "s/^do\.devicecheck=.*/do.devicecheck=1\ndevice.name1=${DEVICE}/" "$AK"
          sed -i -E "s|^kernel\.string=.*|kernel.string=FreeRunner ${MODEL} (${DEVICE}) — ${FLAVOR}|" "$AK"

          KREL=$(cat "$KERNEL_DIR/out/include/config/kernel.release" 2>/dev/null)
          ZIP="exynos9820-${DEVICE}-${FLAVOR}$( [ "$EXTRA_FEATURES" = true ] && echo -extras)-$(date +%Y%m%d).zip"
          (cd AnyKernel3 && zip -rq9 "../$ZIP" ./* -x '*.git*' 'README.md')
          mkdir -p dist && mv "$ZIP" dist/
          (cd dist && sha256sum "$ZIP" > "$ZIP.sha256")
          cp "$KERNEL_DIR/out/.config" "dist/config-${DEVICE}.txt"
          {
            echo "KERNEL_COMMIT=$KERNEL_COMMIT"
            echo "KERNEL_RELEASE=\"$KREL\""
            echo "SUSFS_VERSION=$(grep -m1 '#define SUSFS_VERSION' "$KERNEL_DIR/include/linux/susfs.h" 2>/dev/null | cut -d'"' -f2)"
            echo "TOOLCHAIN=\"$TOOLCHAIN\""
          } > "dist/info-${DEVICE}.txt"

      # GitHub always wraps an artifact in a zip on download. The flashable zip gets its own
      # artifact: download it, unzip it once, and flash the zip found inside (has META-INF).
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: FLASH-unzip-first-${{ matrix.device }}
          path: dist/*.zip
          compression-level: 0

      - name: Upload checksums, config, info
        uses: actions/upload-artifact@v4
        with:
          name: info-${{ matrix.device }}
          path: |
            dist/*.sha256
            dist/config-*.txt
            dist/info-*.txt

  # ------------------------------------------------------------------
  # 3) Publish the GitHub Release
  # ------------------------------------------------------------------
  release:
    needs: [check, build]
    if: >-
      !cancelled() && needs.check.outputs.build == 'true' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: originsu-${{ needs.check.outputs.tag }}
      ORIGINSU_TAG: ${{ needs.check.outputs.tag }}
      KERNEL_BRANCH: ${{ needs.check.outputs.branch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{FLASH-unzip-first-*,info-*}"
          merge-multiple: true

      - name: Fetch the OriginSU manager APK
        # Same tag as the kernel (KazeSU/KazeSU release "legacy-<tag>"); arm64-v8a only.
        # Skipped for the KernelSU-Next control build.
        if: inputs.root != 'ksunext'
        run: |
          gh release download "$ORIGINSU_TAG" --repo KazeSU/KazeSU \
            --pattern 'OriginSU_*-arm64-v8a-release.apk' --dir dist
          APK="$(ls dist/OriginSU_*-arm64-v8a-release.apk 2>/dev/null | head -n1)"
          [ -n "$APK" ] || { echo "::error::OriginSU manager APK not found in KazeSU/KazeSU release $ORIGINSU_TAG"; exit 1; }
          echo "MANAGER_APK=$(basename "$APK")" >> "$GITHUB_ENV"
          echo "-> $(basename "$APK") ($(du -h "$APK" | cut -f1))"

      - name: Write release notes
        run: |
          ls dist/*.zip >/dev/null 2>&1 || { echo "::error::No zip was built"; exit 1; }
          source "$(ls dist/info-*.txt | head -1)"
          DEVROWS=""
          for z in $(ls dist/*.zip | sort); do
            b=$(basename "$z"); dev=$(echo "$b" | sed -nE 's/^exynos9820-([a-z0-9]+)-.*/\1/p')
            case "$dev" in
              beyond0lte) m="Galaxy S10e";; beyond1lte) m="Galaxy S10";; beyond2lte) m="Galaxy S10+";;
              beyondx) m="Galaxy S10 5G";; d1) m="Galaxy Note10";; d1x) m="Galaxy Note10 5G";;
              d2s) m="Galaxy Note10+";; d2x) m="Galaxy Note10+ 5G";; f62) m="Galaxy F62";; *) m="$dev";;
            esac
            DEVROWS="${DEVROWS}| ${m} | \`${dev}\` | \`${b}\` |"$'\n'
          done
          cat > notes.md <<EOF
          ## Exynos 9820 kernels (FreeRunner base) — OriginSU \`${ORIGINSU_TAG}\`

          | | |
          |---|---|
          | OriginSU | [${ORIGINSU_TAG}](https://github.com/KazeSU/KazeSU/releases/tag/${ORIGINSU_TAG}) (final OriginSU release, kernel + manager, now hosted by KazeSU as "legacy-${ORIGINSU_TAG}") |
          | TCP | BBR + fq (default) |
          | Optimizations | zstd for ZRAM (optional, lz4 stays default) · IPv6 HL target (on top of FreeRunner's own tuning) |
          | Manager | \`${MANAGER_APK:-n/a}\` (attached) |
          | SuSFS | \`${SUSFS_VERSION:-n/a}\` (FreeRunner in-tree) |
          | Kernel | FreeRunner \`${KERNEL_BRANCH}\` @ [\`${KERNEL_COMMIT}\`](https://github.com/Project-Matrixx-New/android_kernel_samsung_exynos9820/commit/${KERNEL_COMMIT}) |
          | Kernel version | \`${KERNEL_RELEASE}\` |
          | Toolchain | ${TOOLCHAIN} |
          | Build date | $(date -u +%Y-%m-%d) |

          ### Which zip for my device?
          Flash **only** the zip whose codename matches your phone:

          | Device | Codename | Zip |
          |---|---|---|
          ${DEVROWS}
          > ⚠️ **Community rebuild — test before daily use.** Back up your stock \`boot\` first.

          Flash from TWRP, then install the attached **OriginSU manager** (\`${MANAGER_APK:-see the legacy-${ORIGINSU_TAG} release}\`,
          same version as the kernel — not the KazeSU v1.x manager).

          ### Modules
          OriginSU mounts modules itself: pick the mode in the manager's **OriginMount** screen.
          With an \`-extras\` zip, **NoMount** is built into the kernel (no real mounts, nothing in \`/proc/mounts\`):
          choose the \`nomount\` mode and do not install the separate NoMount module zip.

          > **Why OriginSU and not KazeSU?** KazeSU v1.x does not build on this Linux 4.14 kernel (its SELinux
          > code needs 5.10+), and 4.14 is the newest kernel available for Exynos 9820. OriginSU \`${ORIGINSU_TAG}\`
          > stays the recommended root here. The FreeRunner developer is taking the project over:
          > [LeDrew2017/FreeRunnerKernel](https://github.com/LeDrew2017/FreeRunnerKernel/releases).
          EOF
          sed -i 's/^          //' notes.md

      - name: Create (or replace) the release
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Exynos 9820 (FreeRunner) — OriginSU ${ORIGINSU_TAG}" \
            --notes-file notes.md --latest \
            dist/*.zip dist/*.sha256 dist/config-*.txt $(ls dist/*.apk 2>/dev/null)
