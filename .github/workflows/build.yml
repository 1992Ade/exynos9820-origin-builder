name: Build Exynos 9820 Kernels (FreeRunner base) with OriginSU

# Self-contained workflow. Kernel: LeDrew2017/android_kernel_samsung_exynos9820
# (the source behind FreeRunnerKernel), Linux 4.14, Galaxy S10 / Note10 / F62 family.
# The upstream kernel ships with KernelSU-Next; here it is replaced by OriginSU, with
# SuSFS + its inline hooks added from JackA1ltman's NonGKI patches (same method as the
# 1992Ade sm6150 / msm8937 builders), plus Baseband Guard, NoMount and Droidspaces.
#
# The default branch (testing-fifteen) is a clean kernel, so SuSFS is patched in. On a
# branch that already ships SuSFS (e.g. testing-fourteen-v3.0) the patch simply no-ops.

on:
  schedule:
    - cron: "43 4 * * 0"   # Sunday 04:43 UTC
  workflow_dispatch:
    inputs:
      originsu_ref:
        description: "OriginSU tag to build (empty = latest release)"
        required: false
        default: ""
      kernel_branch:
        description: "android_kernel_samsung_exynos9820 branch (testing-fifteen = clean tree, SuSFS v2.4.0 patched in)"
        required: false
        default: "testing-fifteen"
      device:
        description: "Device to build (all = every device)"
        type: choice
        options: [all, beyond0lte, beyond1lte, beyond2lte, beyondx, d1, d1x, d2s, d2x, f62]
        default: all
      hook_mode:
        description: "susfs = root + SuSFS hiding (patched in); manual = root only, no SuSFS"
        type: choice
        options: [susfs, manual]
        default: susfs
      extra_features:
        description: "Add Baseband Guard + NoMount + Droidspaces (set false to build OriginSU only, for boot bisection)"
        type: boolean
        default: true
      kpm:
        description: "Enable CONFIG_KPM"
        type: boolean
        default: false
      publish:
        description: "Publish a GitHub Release"
        type: boolean
        default: true

concurrency:
  group: kernel-build
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  KERNEL_REPO: LeDrew2017/android_kernel_samsung_exynos9820
  KERNEL_DIR: android_kernel_samsung_exynos9820
  KERNEL_VERSION: "4.14"
  AK3_REPO: https://github.com/LeDrew2017/Anykernel
  KBUILD_BUILD_USER: builder
  KBUILD_BUILD_HOST: github-actions
  MAKE_ARGS: ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

jobs:
  # ------------------------------------------------------------------
  # 1) Do we need to build? (new OriginSU version, with its manager APK)
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      build: ${{ steps.ver.outputs.build }}
      branch: ${{ steps.ver.outputs.branch }}
      devices: ${{ steps.ver.outputs.devices }}
      nongki_sha: ${{ steps.ver.outputs.nongki_sha }}
    steps:
      - name: Compare OriginSU latest release with our releases
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ inputs.kernel_branch }}"; BRANCH="${BRANCH:-testing-fourteen-v3.0}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # Device matrix: one device when picked, otherwise all of them (schedule = all)
          DEV="${{ inputs.device }}"
          if [ -z "$DEV" ] || [ "$DEV" = "all" ]; then
            echo 'devices=["beyond0lte","beyond1lte","beyond2lte","beyondx","d1","d1x","d2s","d2x","f62"]' >> "$GITHUB_OUTPUT"
          else
            echo "devices=[\"$DEV\"]" >> "$GITHUB_OUTPUT"
          fi

          TAG="${{ inputs.originsu_ref }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo samakshkambxj/OriginSU --json tagName -q .tagName 2>/dev/null || true)
          fi
          [ -n "$TAG" ] || { echo "::error::Could not determine the OriginSU version"; exit 1; }
          echo "OriginSU version: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Pin JackA1ltman's SuSFS patches for the whole run
          NONGKI_SHA=$(gh api repos/JackA1ltman/NonGKI_Kernel_Build_2nd/commits/mainline -q .sha)
          echo "NonGKI patches: $NONGKI_SHA"
          echo "nongki_sha=$NONGKI_SHA" >> "$GITHUB_OUTPUT"

          APKS=$(gh release view "$TAG" --repo samakshkambxj/OriginSU --json assets -q '.assets[].name' 2>/dev/null | grep -E '\.apk$' || true)
          if [ -z "$APKS" ]; then
            echo "::warning::OriginSU release $TAG has no manager APK yet -> no build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run -> forced build"; echo "build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "originsu-$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release originsu-$TAG already published -> nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected -> build"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # 2) Build (one job per device)
  # ------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Built from the check job: one device when the 'device' input is set, else all of them.
        # beyond0lte=S10e, beyond1lte=S10, beyond2lte=S10+, beyondx=S10 5G,
        # d1=Note10, d1x=Note10 5G, d2s=Note10+, d2x=Note10+ 5G, f62=Galaxy F62.
        device: ${{ fromJSON(needs.check.outputs.devices) }}
    env:
      DEVICE: ${{ matrix.device }}
      ORIGINSU_TAG: ${{ needs.check.outputs.tag }}
      KERNEL_BRANCH: ${{ needs.check.outputs.branch }}
      HOOK_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.hook_mode || 'susfs' }}
      NONGKI: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/${{ needs.check.outputs.nongki_sha }}/Patches
      KPM: ${{ github.event_name == 'workflow_dispatch' && inputs.kpm || 'false' }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex zip p7zip-full curl git wget \
            libssl-dev libelf-dev zstd lld python3 python-is-python3 cpio unzip patchutils ccache \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Per-device defconfig check + clone kernel
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "https://github.com/${KERNEL_REPO}.git" "$KERNEL_DIR"
          echo "KERNEL_COMMIT=$(git -C "$KERNEL_DIR" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          D="$KERNEL_DIR/arch/arm64/configs/exynos9820-${DEVICE}_defconfig"
          [ -f "$D" ] || { echo "::error::$D missing on $KERNEL_BRANCH — skipping $DEVICE"; exit 1; }

      - name: Download Neutron Clang
        run: |
          TC_URL="$(curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*"' | head -n1 | cut -d '"' -f4)"
          [ -n "$TC_URL" ] || { echo "Toolchain URL not found"; exit 1; }
          mkdir -p "$KERNEL_DIR/clang"
          curl -fL --retry 5 --retry-all-errors -o /tmp/clang.tar.zst "$TC_URL"
          tar --zstd -C "$KERNEL_DIR/clang" -xf /tmp/clang.tar.zst
          rm -f /tmp/clang.tar.zst
          echo "$PWD/$KERNEL_DIR/clang/bin" >> "$GITHUB_PATH"
          echo "TOOLCHAIN=$("$KERNEL_DIR/clang/bin/clang" --version | head -n1)" >> "$GITHUB_ENV"

      - name: Generate kernel config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p out
          make O=out $MAKE_ARGS "exynos9820-${DEVICE}_defconfig"
          { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS olddefconfig

          cp out/.config "arch/arm64/configs/${DEVICE}_stock_defconfig"
          cp out/.config "arch/arm64/configs/${DEVICE}_origin_defconfig"
          rm -rf out
          echo "FINAL_DEFCONFIG=arch/arm64/configs/${DEVICE}_origin_defconfig" >> "$GITHUB_ENV"
          echo "COMPILE_DEFCONFIG=${DEVICE}_origin_defconfig" >> "$GITHUB_ENV"
          sed -i "s|\$(KCONFIG_CONFIG)|arch/arm64/configs/${DEVICE}_stock_defconfig|g" kernel/Makefile 2>/dev/null || true

      - name: Device patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          sed -i "s/printf '%s' -dirty/:/g" scripts/setlocalversion 2>/dev/null || true
          sed -i 's/CONFIG_IKHEADERS=y/# CONFIG_IKHEADERS is not set/g' "$FINAL_DEFCONFIG"
          # Loosen recent-Clang warnings that break old trees (incl. the -Werror const-init
          # ones that fail kernel/params.c on this tree)
          sed -i 's/-Wno-format-security/-Wno-format-security -Wno-declaration-after-statement -Wno-implicit-int -Wno-enum-conversion -Wno-misleading-indentation -Wno-unsequenced -Wno-implicit-function-declaration -Wno-implicit-enum-enum-cast -Wno-default-const-init-field-unsafe -Wno-default-const-init-var-unsafe -Wno-default-const-init-unsafe -Wno-macro-redefined -Wno-unused-but-set-global -Wno-unused-but-set-variable/g' Makefile 2>/dev/null || true
          # Belt-and-braces: also append to KBUILD_CFLAGS so they apply even if the anchor moves.
          # -Wno-macro-redefined: OriginSU pulls in a newer susfs_def.h whose INODE_STATE_* /
          # TRY_UMOUNT_* macros duplicate the tree's v1.5.x susfs.h — IDENTICAL values, just
          # BIT(n) vs literal notation, so the redefinition is harmless.
          # -Wno-error: this old 4.14 vendor tree (esp. the bcmdhd Wi-Fi driver) trips many
          # -Werror warnings under recent Clang; make them non-fatal instead of chasing each one.
          sed -i '/^export KBUILD_CFLAGS/i KBUILD_CFLAGS += -Wno-default-const-init-field-unsafe -Wno-default-const-init-var-unsafe -Wno-default-const-init-unsafe -Wno-macro-redefined -Wno-unused-but-set-global -Wno-unused-but-set-variable -Wno-ignored-optimization-argument -Wno-error' Makefile 2>/dev/null || true
          # The Broadcom Wi-Fi (bcmdhd) Makefiles add their OWN -Werror in DHDCFLAGS, which
          # overrides the global -Wno-error and makes Clang-ignored flags like -fmerge-constants
          # fatal. Strip -Werror from those Makefiles so their warnings are non-fatal too.
          find drivers/net/wireless/broadcom -name Makefile -print0 2>/dev/null \
            | xargs -0 -r sed -i 's/\([[:space:]]\)-Werror\([[:space:]]\)/\1\2/g' 2>/dev/null || true

      - name: Integrate OriginSU (replacing KernelSU-Next)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # Start from a clean KernelSU (the FreeRunner tree may ship one in-tree)
          rm -rf KernelSU drivers/kernelsu

          # 1) Set up OriginSU (clone into ./KernelSU + drivers/kernelsu symlink)
          curl -LSs --fail --retry 3 https://raw.githubusercontent.com/samakshkambxj/OriginSU/main/kernel/setup.sh \
            | bash -s "$ORIGINSU_TAG"
          [ -e drivers/kernelsu/Kconfig ] || { echo "::error::drivers/kernelsu missing after setup.sh"; exit 1; }

          # 1b) OriginSU non-GKI fix: include preinit.h unconditionally
          F=KernelSU/kernel/runtime/ksud_integration.c
          if [ -f "$F" ] && grep -q 'ksu_preinit_release' "$F" && \
             ! sed -n '1,/^#if defined(CONFIG_KSU_TRACEPOINT_HOOK)/p' "$F" | grep -q '^#include "preinit/preinit.h"'; then
            sed -i '0,/^#if defined(CONFIG_KSU_TRACEPOINT_HOOK)/s//#include "preinit\/preinit.h" \/\/ fix non-GKI link\n&/' "$F"
          fi

          # 1c) 4.14 fix: pr_*_ratelimited()/DEFINE_RATELIMIT_STATE need <linux/ratelimit.h>
          grep -rlE '_ratelimited\(|DEFINE_RATELIMIT_STATE|__ratelimit\(' \
               --include='*.c' --include='*.h' KernelSU/kernel 2>/dev/null | while read -r f; do
            grep -q 'linux/ratelimit.h' "$f" || { sed -i '1i #include <linux/ratelimit.h> /* fix 4.14 */' "$f"; }
          done

          # 1d) 4.14 LINK fix: OriginSU calls helpers that don't exist on 4.14 (kvcalloc /
          #     kvmalloc_array were added in 4.18, ktime_get_boottime_ns in 5.3). Generate a
          #     header with fallbacks for whatever the tree lacks and force-include it into every
          #     OriginSU object. Nothing is defined if the tree already has the helper.
          has() { grep -rqE "(static[[:space:]]+(__always_)?inline[^;]*[[:space:]*]$1[[:space:]]*\(|^#[[:space:]]*define[[:space:]]+$1\(|extern[^;]*[[:space:]*]$1[[:space:]]*\()" include/linux; }
          COMPAT="$PWD/KernelSU/kernel/builder_compat_414.h"
          {
            echo '/* Generated by the exynos9820 builder: fallbacks for helpers missing from 4.14 */'
            echo '#ifndef __BUILDER_COMPAT_414_H'
            echo '#define __BUILDER_COMPAT_414_H'
            echo '#if defined(__KERNEL__) && !defined(__ASSEMBLY__)'
            echo '#include <linux/kernel.h>'
            echo '#include <linux/types.h>'
            echo '#include <linux/gfp.h>'
            echo '#include <linux/mm.h>'
            echo '#include <linux/slab.h>'
            echo '#include <linux/vmalloc.h>'
            echo '#include <linux/ktime.h>'
            echo '#include <linux/timekeeping.h>'
            if ! has kvmalloc; then
              echo 'static inline void *kvmalloc(size_t size, gfp_t flags)'
              echo '{ void *p = kmalloc(size, flags | __GFP_NOWARN | __GFP_NORETRY);'
              echo '  return p ? p : __vmalloc(size, flags | __GFP_HIGHMEM, PAGE_KERNEL); }'
            fi
            if ! has kvzalloc; then
              echo 'static inline void *kvzalloc(size_t size, gfp_t flags) { return kvmalloc(size, flags | __GFP_ZERO); }'
            fi
            if ! has kvmalloc_array; then
              echo 'static inline void *kvmalloc_array(size_t n, size_t size, gfp_t flags)'
              echo '{ if (size != 0 && n > SIZE_MAX / size) return NULL; return kvmalloc(n * size, flags); }'
            fi
            if ! has kvcalloc; then
              echo 'static inline void *kvcalloc(size_t n, size_t size, gfp_t flags) { return kvmalloc_array(n, size, flags | __GFP_ZERO); }'
            fi
            if ! has kmemdup_nul; then
              echo 'static inline char *kmemdup_nul(const char *s, size_t len, gfp_t gfp)'
              echo '{ char *b; if (!s) return NULL; b = kmalloc(len + 1, gfp); if (b) { memcpy(b, s, len); b[len] = 0; } return b; }'
            fi
            for c in boottime:boot real:real clocktai:tai; do
              if ! has "ktime_get_${c%%:*}_ns" && has "ktime_get_${c#*:}_ns"; then
                echo "static inline u64 ktime_get_${c%%:*}_ns(void) { return ktime_get_${c#*:}_ns(); }"
              fi
            done
            echo '#endif'
            echo '#endif'
          } > "$COMPAT"
          echo "ccflags-y += -include $COMPAT" >> KernelSU/kernel/Kbuild
          echo "--- 4.14 compat header ---"; cat "$COMPAT"

          # 2) Common configs (OriginSU)
          cat >> "$FINAL_DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          # CONFIG_KSU_DEBUG is not set
          CONFIG_HAVE_SYSCALL_TRACEPOINTS=y
          CONFIG_THREAD_INFO_IN_TASK=y
          EOF
          if [ "$KPM" = "true" ]; then echo "CONFIG_KPM=y" >> "$FINAL_DEFCONFIG"; else echo "# CONFIG_KPM is not set" >> "$FINAL_DEFCONFIG"; fi

          if [ "$HOOK_MODE" = "susfs" ]; then
            # 3a) SuSFS. If the branch already ships it (the dev's "fourteen" branches), use it
            # as-is: NO patch and NO hook script (the tree already carries both) — this is the
            # reliable, FreeRunner-aligned path. Only a clean branch gets patched + hooked.
            if [ -f fs/susfs.c ]; then
              echo "-- Tree already ships SuSFS (dev-integrated) — using it, no patch"
            else
              curl -LSs --fail --retry 3 "$NONGKI/Patch/susfs_patch_to_${KERNEL_VERSION}.patch" | patch -p1 -s --fuzz=5 || true
              [ -f fs/susfs.c ] || { echo "::error::SuSFS not present after patch (fs/susfs.c missing) — try hook_mode=manual"; exit 1; }
            fi
            # Always run the inline hook script. It is guarded per file (it SKIPS any file that
            # already carries a ksu_handle hook — the dev's 4 on the fourteen branches) and only
            # adds the ones OriginSU still requires (sys_read / setresuid / reboot). Without this,
            # OriginSU's inline_hook_check.mk fails ("integrate OriginSU correctly").
            curl -LSs --fail --retry 3 "$NONGKI/susfs_inline_hook_patches.sh" -o /tmp/hooks.sh
            NEED_HOOKS=1
            cat >> "$FINAL_DEFCONFIG" <<'EOF'
          CONFIG_KSU_SUSFS=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          else
            # 3b) Manual hook: root only, no SuSFS
            cat >> "$FINAL_DEFCONFIG" <<'EOF'
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_SUSFS is not set
          EOF
            curl -LSs --fail --retry 3 "$NONGKI/syscall_hook_patches.sh" -o /tmp/hooks.sh
            NEED_HOOKS=1
          fi
          sed -i 's/^[[:space:]]*CONFIG_/CONFIG_/; s/^[[:space:]]*# CONFIG_/# CONFIG_/' "$FINAL_DEFCONFIG"

          # 3c) OriginSU v4.3+ includes <linux/susfs_def.h> under CONFIG_KSU_SUSFS, but this
          #     tree's bundled SuSFS predates that split-out header. Provide it from susfs4ksu
          #     (matching kernel version) so OriginSU's sucompat.h compiles. The tree's own SuSFS
          #     does not reference this header, so it only satisfies OriginSU.
          if [ "$HOOK_MODE" = "susfs" ] && [ ! -f include/linux/susfs_def.h ]; then
            curl -LSs --fail --retry 3 "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-${KERNEL_VERSION}/kernel_patches/include/linux/susfs_def.h" -o include/linux/susfs_def.h \
              && echo "-- added include/linux/susfs_def.h from susfs4ksu (kernel-${KERNEL_VERSION})" \
              || echo "::warning::could not fetch susfs_def.h — OriginSU may fail to find it"
          fi

          # 4a) The dev's KSU-Next tree ships an OLD-style read hook (ksu_vfs_read_hook /
          #     ksu_handle_vfs_read in fs/read_write.c) that OriginSU v4.3+ rejects as
          #     "incompatible hook". Strip that block so read_write.c is clean; the hook script
          #     below then adds OriginSU's compatible ksu_handle_sys_read instead.
          if [ -f fs/read_write.c ] && grep -q 'ksu_vfs_read_hook' fs/read_write.c; then
            perl -0pi -e 's/[ \t]*#ifdef CONFIG_KSU[ \t]*\n(?:(?!#endif).)*?ksu_vfs_read_hook(?:(?!#endif).)*?\n[ \t]*#endif[ \t]*\n//gs' fs/read_write.c
            echo "-- stripped legacy ksu_vfs_read_hook from fs/read_write.c (OriginSU adds its own)"
          fi
          # Same for the dev's legacy input hook (ksu_input_hook under CONFIG_KSU_SAFEMODE), which
          # OriginSU also rejects. The tree also carries the compatible ksu_handle_input_handle_event
          # under CONFIG_KSU, so strip only the SAFEMODE/ksu_input_hook blocks and keep that one.
          if [ -f drivers/input/input.c ] && grep -q 'ksu_input_hook' drivers/input/input.c; then
            perl -0pi -e 's/[ \t]*#ifdef CONFIG_KSU_SAFEMODE[ \t]*\n(?:(?!#endif).)*?ksu_input_hook(?:(?!#endif).)*?\n[ \t]*#endif[ \t]*\n//gs' drivers/input/input.c
            echo "-- stripped legacy ksu_input_hook from drivers/input/input.c (kept the compatible one)"
          fi
          # exec.c is different: the legacy bool (ksu_execveat_hook) GATES the compatible
          # ksu_handle_execveat call in the same block, and OriginSU requires that call. So just
          # neutralize the bool (drop its extern + the `if (ksu_execveat_hook)` gate) and keep
          # the handler call.
          if [ -f fs/exec.c ] && grep -qw 'ksu_execveat_hook' fs/exec.c; then
            sed -i '/extern bool ksu_execveat_hook __read_mostly;/d' fs/exec.c
            sed -i 's/if (unlikely(ksu_execveat_hook))/if (unlikely(1))/g' fs/exec.c
            echo "-- neutralized legacy ksu_execveat_hook in fs/exec.c (kept ksu_handle_execveat)"
          fi

          # 4b) Apply the hook script. It is guarded per file (skips files that already carry a
          #     ksu_handle hook — the dev's exec/open/stat/input), so it only adds the hooks
          #     OriginSU still needs: sys_read (now that we cleaned it), setresuid and reboot.
          if [ "${NEED_HOOKS:-0}" = 1 ] && [ -f /tmp/hooks.sh ]; then
            bash /tmp/hooks.sh || echo "::warning::hook script returned non-zero (some hooks may already be in-tree)"
          else
            echo "-- Using the tree's existing hooks (no hook script run)"
          fi

          # 5) 4.14 fix: fs/stat.c flag arg name
          sed -i 's/ksu_handle_stat(&dfd, &fname, &flag);/ksu_handle_stat(\&dfd, \&fname, \&flags);/g' fs/stat.c 2>/dev/null || true

          # 5b) SuSFS sus_mount: 2 of the susfs_patch_to_4.14 hunks reject on Samsung's
          #     fs/namespace.c (divergent context), leaving CL_COPY_MNT_NS / DEFAULT_KSU_MNT_ID /
          #     susfs_is_sdcard_android_data_not_decrypted undeclared. Re-apply them by anchor.
          # Only touch namespace.c when it is in the exact broken state: it *uses* the SuSFS
          # sus_mount symbol but is missing the definitions (rejected hunks). This way a tree
          # that already ships a correct SuSFS (e.g. testing-fourteen-v3.0) is never altered.
          if [ "$HOOK_MODE" = "susfs" ] && [ -f fs/namespace.c ] && \
             grep -q 'susfs_is_sdcard_android_data_not_decrypted' fs/namespace.c; then
            # guard on the #define specifically: the applied hunks already *use* CL_COPY_MNT_NS,
            # so grepping the bare name would wrongly skip adding its definition.
            if ! grep -q '#define CL_COPY_MNT_NS' fs/namespace.c; then
              awk '/#include "pnode.h"/ && !d {
                     print "#ifdef CONFIG_KSU_SUSFS";
                     print "#include <linux/susfs_def.h>";
                     print "#endif";
                     print "#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT";
                     print "extern bool susfs_is_current_ksu_domain(void);";
                     print "extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;";
                     print "#define CL_COPY_MNT_NS BIT(25)";
                     print "#endif";
                     d=1 } { print }' fs/namespace.c > fs/namespace.c.tmp && mv fs/namespace.c.tmp fs/namespace.c
              echo "-- susfs: re-added namespace.c susfs_def include + CL_COPY_MNT_NS block"
            fi
            # The patch's copy_mnt_ns hunk mis-applies via --fuzz on the runner's GNU patch: the
            # `copy_flags |= CL_COPY_MNT_NS` block lands INSIDE exact_copy_from_user's signature
            # (undeclared 'copy_flags' build error). Remove any such block wherever it landed,
            # then insert it correctly in copy_mnt_ns (right after the CL_SHARED_TO_SLAVE line).
            perl -0pi -e 's/[ \t]*#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT[ \t]*\n[ \t]*copy_flags \|= CL_COPY_MNT_NS;[ \t]*\n[ \t]*#endif[ \t]*\n//g' fs/namespace.c
            sed -i 's/\(copy_flags |= CL_SHARED_TO_SLAVE | CL_UNPRIVILEGED;\)/\1\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\tcopy_flags |= CL_COPY_MNT_NS;\n#endif/' fs/namespace.c
            echo "-- susfs: fixed copy_flags |= CL_COPY_MNT_NS placement in copy_mnt_ns"
            rm -f fs/namespace.c.rej
          fi
          # Debug: dump the copy_mnt_ns region + any leftover .rej so namespace.c build
          # errors are diagnosable straight from the log.
          if [ "$HOOK_MODE" = "susfs" ] && [ -f fs/namespace.c ]; then
            echo "::group::DEBUG fs/namespace.c copy_mnt_ns region"
            grep -n -A40 'copy_mnt_ns(unsigned long flags' fs/namespace.c || true
            echo "--- leftover rejects ---"; ls -1 fs/*.rej 2>/dev/null || echo "(none)"
            echo "::endgroup::"
          fi

          # 6) Report the hooks OriginSU looks for (non-fatal: this tree's KSU-Next hooks
          #    differ, so missing ones are flagged and the OriginSU build decides)
          for p in "kernel/sys.c:ksu_handle_setresuid" "fs/exec.c:ksu_handle_execveat" \
                   "fs/open.c:ksu_handle_faccessat" "fs/read_write.c:ksu_handle_sys_read" \
                   "fs/stat.c:ksu_handle_stat" "kernel/reboot.c:ksu_handle_sys_reboot" \
                   "drivers/input/input.c:ksu_handle_input_handle_event"; do
            if grep -q "${p#*:}" "${p%%:*}" 2>/dev/null; then echo "  hook ok: ${p#*:}"; else echo "::warning::hook ${p#*:} not found in ${p%%:*}"; fi
          done

          # 7) Export static SELinux symbols OriginSU/SuSFS need
          unstatic() { [ -f "$1" ] && grep -q "static $2" "$1" && sed -i "s/static $2/$2/" "$1" && echo "  exported: $2" || true; }
          unstatic security/selinux/selinuxfs.c   'ssize_t (\*write_op\[\])'
          unstatic security/selinux/selinuxfs.c   'ssize_t (\*const write_op\[\])'
          unstatic security/selinux/selinuxfs.c   'const struct file_operations sel_handle_status_ops'
          unstatic security/selinux/selinuxfs.c   'DEFINE_MUTEX(sel_mutex);'
          unstatic security/selinux/ss/status.c   'struct page \*selinux_status_page;'
          unstatic security/selinux/ss/status.c   'DEFINE_MUTEX(selinux_status_lock);'
          unstatic security/selinux/ss/services.c 'void security_dump_masked_av'
          unstatic security/selinux/ss/services.c 'void context_struct_compute_av'

          sed -i 's/\$(KSU_COMMIT_SHA)-dirty/$(KSU_COMMIT_SHA)/' KernelSU/kernel/Kbuild 2>/dev/null || true

      - name: Extra features — Baseband Guard, NoMount, Droidspaces
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA_FEATURES: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_features || 'true' }}
        run: |
          if [ "$EXTRA_FEATURES" = "false" ]; then
            echo "-- extra_features=false: building OriginSU only (no Baseband Guard / NoMount / Droidspaces)"
            exit 0
          fi
          ########## 1) Baseband Guard (vc-teahouse) ##########
          echo "== Baseband Guard =="
          curl -LSs --fail --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh" | bash \
            || { echo "::error::Baseband Guard setup failed"; exit 1; }
          echo "CONFIG_BBG=y" >> "$FINAL_DEFCONFIG"
          sed -i 's|^REPO_LINK :=.*|REPO_LINK := https://github.com/vc-teahouse/Baseband-guard|' Baseband-guard/Makefile
          if grep -q "#define DEFINE_LSM(lsm)" "include/linux/lsm_hooks.h" 2>/dev/null; then
            if grep -q "^CONFIG_LSM=" "$FINAL_DEFCONFIG"; then
              sed -i 's/^\(CONFIG_LSM=".*\)"/\1,baseband_guard"/' "$FINAL_DEFCONFIG"
            else
              echo 'CONFIG_LSM="lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"' >> "$FINAL_DEFCONFIG"
            fi
          fi
          if grep -q "struct[[:space:]]\+task_security_struct[[:space:]]\+\*selinux_cred" "security/selinux/include/objsec.h" 2>/dev/null; then
            sed -i '/static inline struct task_security_struct \*selinux_cred/,/[[:space:]]*}/d' security/baseband-guard/tracing/tracing.c
          fi

          ########## 2) NoMount (maxsteeel) ##########
          echo "== NoMount =="
          curl -LSs --fail --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh" | bash -s "v2.3.0-720" \
            || { echo "::error::NoMount setup failed"; exit 1; }
          echo "CONFIG_NOMOUNT=y" >> "$FINAL_DEFCONFIG"

          ########## 3) Droidspaces (ravindu644) ##########
          echo "== Droidspaces =="
          DS_XT="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch"
          DS_CG="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          # Apply patches robustly: try as-is, then with the single-file cgroup path as a fallback.
          apply_ds_patch() {
            local url="$1" desc="$2" f a
            f="$(mktemp)"; a="$(mktemp)"
            wget -qO "$f" "$url" || { echo "::warning::Droidspaces: could not download ${desc}"; rm -f "$f" "$a"; return 0; }
            if patch -p1 --fuzz=5 -t --dry-run < "$f" >/dev/null 2>&1; then
              patch -p1 --fuzz=5 -t < "$f" >/dev/null && echo "-- Droidspaces: applied ${desc}"
            else
              sed 's#kernel/cgroup/cgroup\.c#kernel/cgroup.c#g' "$f" > "$a"
              if ! cmp -s "$f" "$a" && patch -p1 --fuzz=5 -t --dry-run < "$a" >/dev/null 2>&1; then
                patch -p1 --fuzz=5 -t < "$a" >/dev/null && echo "-- Droidspaces: applied ${desc} (single-file cgroup path)"
              else
                echo "::warning::Droidspaces: ${desc} does not apply on this kernel — skipped (configs still enabled)"
              fi
            fi
            rm -f "$f" "$a"
          }
          [ -f "net/netfilter/xt_qtaguid.c" ] && apply_ds_patch "$DS_XT" "xt_qtaguid panic fix"
          apply_ds_patch "$DS_CG" "cgroup prefix fix"

          # This Exynos defconfig already has MEMCG / CFS_BANDWIDTH / CGROUP_PIDS enabled, so the
          # full Droidspaces set is safe here; the main addition is CONFIG_USER_NS (off by default).
          cat >> "$FINAL_DEFCONFIG" <<'EOF'
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IPV6=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y
          CONFIG_USER_NS=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_IP_SET=y
          CONFIG_NETFILTER_XT_SET=y
          EOF
          sed -i 's/^[[:space:]]*CONFIG_/CONFIG_/; s/^[[:space:]]*# CONFIG_/# CONFIG_/' "$FINAL_DEFCONFIG"
          echo "--- extra-feature configs ---"
          grep -E '^CONFIG_(BBG|NOMOUNT|USER_NS|NAMESPACES|OVERLAY_FS)=' "$FINAL_DEFCONFIG" || true

      - name: Compile the kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          mkdir -p out
          make O=out $MAKE_ARGS "$COMPILE_DEFCONFIG"
          { yes "" 2>/dev/null || true; } | make O=out $MAKE_ARGS olddefconfig
          echo "--- Effective OriginSU / feature configs ---"
          grep -E '^(# )?CONFIG_(KSU|KPM|BBG|NOMOUNT)' out/.config || true
          set +e
          make -j"$(nproc --all)" O=out $MAKE_ARGS 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "--- OriginSU messages ---"
          grep -E -- '-- (OriginSU|KernelSU|KPM|SUSFS|You )' build.log | sort -u || true
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "(boot dir missing)"
          # The kernel Image is built before the Samsung post-steps. One of those
          # (lib/libdss-build.sh, a debug-snapshot helper invoked with a relative path that
          # breaks under O=out) can make `make` return non-zero AFTER the Image is already done.
          # So treat the build as successful whenever the Image exists; only fail if it is
          # missing.
          if [ -f out/arch/arm64/boot/Image ]; then
            if [ "$RC" -ne 0 ]; then
              echo "::warning::make returned $RC after producing the Image (likely the Samsung libdss post-step, which is not part of the boot image) — treating as success"
            fi
          else
            echo "::error::Build failed (make exit code $RC) and no Image was produced. First errors:"
            grep -nE "error:|Error [0-9]|undefined reference|undefined symbol|\*\*\*" build.log | head -n 40 || true
            exit "${RC:-1}"
          fi

      - name: Upload build log (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.device }}
          path: |
            ${{ env.KERNEL_DIR }}/build.log
            ${{ env.KERNEL_DIR }}/out/.config
            ${{ env.KERNEL_DIR }}/fs/namespace.c
          if-no-files-found: ignore

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 "$AK3_REPO" AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cp "$KERNEL_DIR/out/arch/arm64/boot/Image" AnyKernel3/Image
          AK=AnyKernel3/anykernel.sh
          case "$DEVICE" in
            beyond0lte) MODEL="Galaxy S10e";;
            beyond1lte) MODEL="Galaxy S10";;
            beyond2lte) MODEL="Galaxy S10+";;
            beyondx)    MODEL="Galaxy S10 5G";;
            d1)         MODEL="Galaxy Note10";;
            d1x)        MODEL="Galaxy Note10 5G";;
            d2s)        MODEL="Galaxy Note10+";;
            d2x)        MODEL="Galaxy Note10+ 5G";;
            f62)        MODEL="Galaxy F62";;
            *)          MODEL="$DEVICE";;
          esac
          # Restrict the zip to this device
          sed -i -E '/^device\.name[0-9]+=/d' "$AK" 2>/dev/null || true
          sed -i -E "s/^do\.devicecheck=.*/do.devicecheck=1\ndevice.name1=${DEVICE}/" "$AK" 2>/dev/null || true
          sed -i -E "s|^kernel\.string=.*|kernel.string=Exynos 9820 ${MODEL} (${DEVICE}) — OriginSU ${ORIGINSU_TAG} (${HOOK_MODE}) - FreeRunner base|" "$AK" 2>/dev/null || true

          KREL=$(cat "$KERNEL_DIR/out/include/config/kernel.release" 2>/dev/null)
          ZIP="exynos9820-${DEVICE}-OriginSU-${ORIGINSU_TAG}-${HOOK_MODE}-$(date +%Y%m%d).zip"
          (cd AnyKernel3 && zip -rq9 "../$ZIP" ./* -x '*.git*' 'README.md')
          mkdir -p dist
          mv "$ZIP" dist/
          (cd dist && sha256sum "$ZIP" > "$ZIP.sha256")
          cp "$KERNEL_DIR/out/.config" "dist/config-${DEVICE}.txt"
          {
            echo "KERNEL_COMMIT=$KERNEL_COMMIT"
            echo "KERNEL_RELEASE=$KREL"
            echo "SUSFS_VERSION=$(grep -m1 '#define SUSFS_VERSION' "$KERNEL_DIR/include/linux/susfs.h" 2>/dev/null | cut -d'"' -f2)"
            echo "TOOLCHAIN=\"$TOOLCHAIN\""
          } > "dist/info-${DEVICE}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exynos9820-${{ matrix.device }}
          path: dist/*

  # ------------------------------------------------------------------
  # 3) Publish the GitHub Release
  # ------------------------------------------------------------------
  release:
    needs: [check, build]
    if: >-
      !cancelled() && needs.check.outputs.build == 'true' &&
      (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: originsu-${{ needs.check.outputs.tag }}
      ORIGINSU_TAG: ${{ needs.check.outputs.tag }}
      KERNEL_BRANCH: ${{ needs.check.outputs.branch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: exynos9820-*
          merge-multiple: true

      - name: Write release notes
        run: |
          ls dist/*.zip >/dev/null 2>&1 || { echo "::error::No zip was built"; exit 1; }
          source "$(ls dist/info-*.txt | head -1)"
          DEVROWS=""
          for z in $(ls dist/*.zip | sort); do
            b=$(basename "$z"); dev=$(echo "$b" | sed -nE 's/^exynos9820-([a-z0-9]+)-.*/\1/p')
            case "$dev" in
              beyond0lte) m="Galaxy S10e";; beyond1lte) m="Galaxy S10";; beyond2lte) m="Galaxy S10+";;
              beyondx) m="Galaxy S10 5G";; d1) m="Galaxy Note10";; d1x) m="Galaxy Note10 5G";;
              d2s) m="Galaxy Note10+";; d2x) m="Galaxy Note10+ 5G";; f62) m="Galaxy F62";; *) m="$dev";;
            esac
            DEVROWS="${DEVROWS}| ${m} | \`${dev}\` | \`${b}\` |"$'\n'
          done
          cat > notes.md <<EOF
          ## Exynos 9820 kernels (FreeRunner base) — OriginSU \`${ORIGINSU_TAG}\`

          | | |
          |---|---|
          | OriginSU | [${ORIGINSU_TAG}](https://github.com/samakshkambxj/OriginSU/releases/tag/${ORIGINSU_TAG}) (kernel + manager) |
          | SuSFS | \`${SUSFS_VERSION:-see susfs variant}\` |
          | Kernel | FreeRunner / \`${KERNEL_BRANCH}\` @ [\`${KERNEL_COMMIT}\`](https://github.com/${KERNEL_REPO}/commit/${KERNEL_COMMIT}) |
          | Kernel version | \`${KERNEL_RELEASE}\` |
          | Build date | $(date -u +%Y-%m-%d) |

          ### Which zip for my device?
          Flash **only** the zip whose codename matches your phone:

          | Device | Codename | Zip |
          |---|---|---|
          ${DEVROWS}
          > ⚠️ **Community rebuild — test before daily use.** This swaps the FreeRunner kernel's
          > KernelSU-Next for OriginSU and adds Baseband Guard / NoMount / Droidspaces. Back up your
          > stock \`boot\` (and \`vbmeta\`) first. If a build doesn't boot, re-run with hook_mode=manual.

          Flash from TWRP, then install the OriginSU manager from the
          [OriginSU release page](https://github.com/samakshkambxj/OriginSU/releases/tag/${ORIGINSU_TAG}).
          EOF
          sed -i 's/^          //' notes.md

      - name: Create (or replace) the release
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Exynos 9820 (FreeRunner) — OriginSU ${ORIGINSU_TAG}" \
            --notes-file notes.md --latest \
            dist/*.zip dist/*.sha256 dist/config-*.txt
